<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris Rahmat Edition</title>
    <!-- Memuat Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Memuat Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <!-- Memuat CSS kustom -->
    <link rel="stylesheet" href="styles.css">
</head>
<body class="selection:bg-pink-500 selection:text-white">

    <div class="game-container flex flex-wrap justify-center items-start p-4 md:p-8 max-w-7xl mx-auto">

        <!-- Area Kanvas Permainan -->
        <div class="canvas-wrapper relative mx-4">
            <h1 class="text-4xl md:text-6xl font-black text-center mb-4 uppercase tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-red-400 to-yellow-300 shadow-lg" style="text-shadow: 0 0 15px rgba(255, 200, 0, 0.4);">
                TETRIS
            </h1>
            <canvas id="tetrisCanvas" width="320" height="640"></canvas>
            
            <!-- Overlay Pesan Game Over -->
            <div id="gameOverOverlay" class="absolute inset-0 bg-black bg-opacity-80 flex flex-col justify-center items-center rounded-xl p-4 hidden transition-opacity duration-300">
                <p class="text-5xl font-black text-red-500 mb-4 animate-pulse">GAME OVER</p>
                <p class="text-xl text-white mb-6">Skor Akhir: <span id="finalScore" class="font-bold text-yellow-300">0</span></p>
                <button id="restartButton" class="px-6 py-3 bg-green-500 hover:bg-green-600 text-white font-bold rounded-lg control-button">
                    Mulai Ulang
                </button>
            </div>
        </div>

        <!-- Panel Informasi dan Kontrol -->
        <div class="info-panel w-full md:w-64 mt-8 md:mt-24 md:ml-8 flex flex-col items-center">

            <!-- Panel Skor dan Level -->
            <div class="w-full bg-gray-800 p-4 rounded-xl shadow-2xl mb-6 border-4 border-purple-500">
                <div class="mb-3 border-b border-gray-700 pb-2">
                    <p class="text-xs uppercase tracking-wider text-pink-400">Skor</p>
                    <p id="score" class="text-4xl font-extrabold text-white">0</p>
                </div>
                <div>
                    <p class="text-xs uppercase tracking-wider text-pink-400">Level</p>
                    <p id="level" class="text-2xl font-extrabold text-yellow-400">1</p>
                </div>
            </div>

            <!-- Panel Blok Berikutnya (Next Piece) -->
            <div class="w-full bg-gray-800 p-4 rounded-xl shadow-2xl mb-8 border-4 border-purple-500">
                <p class="text-sm uppercase tracking-wider text-pink-400 mb-2 font-bold">Blok Berikutnya</p>
                <canvas id="nextPieceCanvas" width="80" height="80" class="mx-auto block"></canvas>
            </div>

            <!-- Kontrol (Di Desktop dan Mobile) -->
            <div class="w-full max-w-xs md:max-w-full">
                <p class="text-xs uppercase tracking-wider text-purple-400 mb-2 font-bold text-center">Kontrol Keyboard</p>
                <div class="flex flex-wrap justify-center mb-4 text-xs gap-1">
                    <span class="inline-block bg-gray-700 text-white px-2 py-1 rounded-md font-bold">A (Kiri)</span>
                    <span class="inline-block bg-gray-700 text-white px-2 py-1 rounded-md font-bold">D (Kanan)</span>
                    <span class="inline-block bg-gray-700 text-white px-2 py-1 rounded-md font-bold">S (Turun)</span>
                    <span class="inline-block bg-gray-700 text-white px-2 py-1 rounded-md font-bold">W (Putar)</span>
                    <span class="inline-block bg-gray-700 text-white px-2 py-1 rounded-md font-bold">Spasi (Drop)</span>
                </div>
            </div>
             
            <!-- Kontrol Sentuh/Mobile -->
            <div id="mobileControls" class="md:hidden w-full max-w-xs mt-6">
                <p class="text-xs uppercase tracking-wider text-purple-400 mb-2 font-bold text-center">Kontrol Sentuh</p>
                <div class="flex justify-center space-x-4 mb-4">
                    <!-- Putar -->
                    <button id="btnRotate" class="control-button bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 px-6 rounded-lg text-lg">
                        Putar
                    </button>
                    <!-- Hard Drop -->
                    <button id="btnHardDrop" class="control-button bg-red-500 hover:bg-red-600 text-white font-bold py-3 px-6 rounded-lg text-lg">
                        Drop
                    </button>
                </div>
                <div class="flex justify-center space-x-2">
                    <!-- Kiri -->
                    <button id="btnLeft" class="control-button bg-yellow-500 hover:bg-yellow-600 text-black font-bold p-4 rounded-full text-2xl">
                        &#9664;
                    </button>
                    <!-- Soft Drop -->
                    <button id="btnDown" class="control-button bg-green-500 hover:bg-green-600 text-white font-bold p-4 rounded-full text-2xl">
                        &#9660;
                    </button>
                    <!-- Kanan -->
                    <button id="btnRight" class="control-button bg-yellow-500 hover:bg-yellow-600 text-black font-bold p-4 rounded-full text-2xl">
                        &#9654;
                    </button>
                </div>
            </div>
        </div>

    </div>

    <!-- Memuat JavaScript game logic -->
    <script src="game.js"></script>
</body>
</html>
